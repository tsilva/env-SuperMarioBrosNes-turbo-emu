name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Optional git ref to build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: "3.14"
  UV_CACHE_DIR: .uv-cache

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.13"

      - name: Install release environment
        run: uv sync --frozen --extra dev --group dev

      - name: Configure optional ROM tests
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path

          from env_supermariobrosnes_turbo_emu.roms import EXPECTED_SMB_ROM_SHA256, sha256_path

          try:
              import stable_retro
          except ModuleNotFoundError:
              rom_path = None
              data_path = None
          else:
              data_path = Path(stable_retro.__file__).resolve().parent / "data"
              rom_path = (
                  data_path
                  / "stable"
                  / "SuperMarioBros-Nes-v0"
                  / "rom.nes"
              )
          if rom_path is not None and rom_path.exists():
              digest = sha256_path(rom_path)
              if digest != EXPECTED_SMB_ROM_SHA256:
                  raise SystemExit(f"unexpected release ROM SHA-256: {digest}")
              print(f"RETRO_DATA_PATH={data_path}")
          else:
              print("ALLOW_MISSING_ROM_TESTS=1")
          PY

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION.txt)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        run: uv run python .codex/skills/build-release/scripts/release_build.py check-version --version "${{ steps.version.outputs.version }}"

      - name: Check PyPI version is unused
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: uv run python .codex/skills/build-release/scripts/release_build.py check-pypi --version "${{ steps.version.outputs.version }}"

      - name: Run source checks
        run: |
          cargo fmt --check --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo check --workspace --release
          uv run python scripts/check_smb_dependency_closure.py
          uv run maturin develop --release
          make test PYTHON=.venv/bin/python

  build:
    name: Build ${{ matrix.platform }} wheel
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            cargo_target_dir: target-release-macos-arm64
          - platform: linux-x86_64
            runner: ubuntu-24.04
            cargo_target_dir: target-release-linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Resolve checked-out source
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.13"

      - name: Restore Cargo build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cargo_target_dir }}
          key: cargo-target-v2-${{ matrix.platform }}-${{ steps.source.outputs.sha }}
          restore-keys: |
            cargo-target-v2-${{ matrix.platform }}-

      - name: Install release environment
        run: uv sync --frozen --no-default-groups --group release

      - name: Build wheel
        run: >-
          uv run python .codex/skills/build-release/scripts/release_build.py build-platform
          --platform "${{ matrix.platform }}"
          --version "${{ needs.validate.outputs.version }}"

      - name: Smoke built wheel
        run: >-
          uv run python .codex/skills/build-release/scripts/release_build.py smoke-wheel
          "wheelhouse-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}
          path: wheelhouse-v${{ needs.validate.outputs.version }}-${{ matrix.platform }}/*.whl
          if-no-files-found: error

  parity:
    name: Verify exact macOS wheel parity
    needs:
      - validate
      - build
    runs-on: macos-15
    environment: parity
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.13"

      - name: Download canonical wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheel-v${{ needs.validate.outputs.version }}-macos-arm64
          path: candidate

      - name: Install pinned parity tools
        run: |
          uv venv --python 3.11 .parity-venv
          uv pip install --exclude-newer "7 days" --python .parity-venv/bin/python \
            --exclude-newer-package turbobench-cli=2026-09-02T14:27:04.219491Z \
            "stable-retro==1.0.1" "turbobench-cli==2.0.6"

      - name: Install canonical game payload
        env:
          SMB_ROM_GZIP_BASE64: ${{ secrets.SMB_ROM_GZIP_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          asset_root="$(.parity-venv/bin/python -c \
            'from pathlib import Path; import stable_retro; print(Path(stable_retro.__file__).parent / "data" / "stable")')"
          game_dir="$asset_root/SuperMarioBros-Nes-v0"
          shopt -s nullglob
          wheels=(candidate/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            printf 'expected one canonical wheel, found %s\n' "${#wheels[@]}" >&2
            exit 1
          fi
          mkdir candidate-assets
          unzip -q "${wheels[0]}" -d candidate-assets
          state_root="$(find candidate-assets -type d \
            -path '*/data/SuperMarioBros-Nes-v0' -print -quit)"
          if [[ -z "$state_root" ]]; then
            echo "candidate wheel does not contain the canonical state catalog" >&2
            exit 1
          fi
          for state in Level1-1 Level1-2 Level1-3 Level1-4; do
            cp "$state_root/$state.state" "$game_dir/$state.state"
          done
          .parity-venv/bin/python - "$game_dir/rom.nes" <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          encoded = os.environ.get("SMB_ROM_GZIP_BASE64")
          if not encoded:
              raise SystemExit("SMB_ROM_GZIP_BASE64 is not configured")
          path.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          expected = "f61548fdf1670cffefcc4f0b7bdcdd9eaba0c226e3b74f8666071496988248de"
          observed = hashlib.sha256(path.read_bytes()).hexdigest()
          if observed != expected:
              raise SystemExit(f"unexpected Super Mario Bros. ROM SHA-256: {observed}")
          PY
          echo "TURBOBENCH_ASSET_ROOT=$asset_root" >> "$GITHUB_ENV"

      - name: Run and verify exact parity
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(candidate/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            printf 'expected one canonical wheel, found %s\n' "${#wheels[@]}" >&2
            exit 1
          fi
          wheel="$(cd "$(dirname "${wheels[0]}")" && pwd)/$(basename "${wheels[0]}")"
          .parity-venv/bin/turbobench parity supermario/world1-v1 \
            --candidate "env-supermariobrosnes-turbo-emu@artifact:$wheel" \
            --python 3.11 \
            --output parity-receipt
          .parity-venv/bin/turbobench verify-parity parity-receipt \
            --require-canonical \
            --require-provider env-supermariobrosnes-turbo-emu

      - name: Upload parity receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-receipt-v${{ needs.validate.outputs.version }}
          path: parity-receipt/**
          if-no-files-found: error

  final-check:
    name: Audit release distributions
    needs:
      - validate
      - build
      - parity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.13"

      - name: Install release environment
        run: uv sync --frozen --no-default-groups --group release

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-wheel-v${{ needs.validate.outputs.version }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Download parity receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: parity-receipt-v${{ needs.validate.outputs.version }}
          path: parity-receipt

      - name: Audit complete wheel set
        shell: bash
        run: >-
          uv run python .codex/skills/build-release/scripts/release_build.py final-check
          --version "${{ needs.validate.outputs.version }}"
          wheelhouse/*.whl

      - name: Build and audit source distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/primary
          cp wheelhouse/*.whl dist/primary/
          uv run maturin sdist --out dist/primary
          uv run python .codex/skills/build-release/scripts/release_build.py audit-sdist \
            --version "${{ needs.validate.outputs.version }}" \
            dist/primary/*.tar.gz
          uv run python scripts/check_sdist_internal_crates.py dist/primary/*.tar.gz
          uv run twine check dist/primary/*
          mkdir -p dist/evidence
          cp -R parity-receipt dist/evidence/

      - name: Smoke stable ABI on Python 3.9
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.9
          uv run python .codex/skills/build-release/scripts/release_build.py smoke-wheel \
            wheelhouse/*manylinux*x86_64*.whl \
            --python "$(uv python find 3.9)"
          uv run python .codex/skills/build-release/scripts/release_build.py smoke-sdist \
            dist/primary/*.tar.gz \
            --python "$(uv python find 3.9)"

      - name: Upload audited distribution bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-v${{ needs.validate.outputs.version }}
          path: dist/**
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - validate
      - final-check
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/env-supermariobrosnes-turbo-emu
    permissions:
      id-token: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ needs.validate.outputs.version }}
          path: dist

      - name: Publish primary package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/primary

  github-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - validate
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-v${{ needs.validate.outputs.version }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          find dist -type f ! -empty -exec cp {} release-assets/ \;
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
