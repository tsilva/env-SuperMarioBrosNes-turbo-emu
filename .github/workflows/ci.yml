name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ALLOW_MISSING_ROM_TESTS: "1"
  CARGO_TERM_COLOR: always
  UV_CACHE_DIR: .uv-cache

jobs:
  validate:
    name: Validate Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ci-cargo-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-cargo-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install test environment
        run: uv sync --frozen --extra dev --group dev

      - name: Audit universal dependency graph
        if: matrix.python-version == '3.14'
        run: >-
          uv audit --locked
          --ignore GHSA-6w46-j5rx-g56g

      - name: Check formatting and release compilation
        if: matrix.python-version == '3.14'
        run: |
          cargo fmt --check --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo check --workspace --release
          uv run python scripts/check_smb_dependency_closure.py

      - name: Build editable extension
        run: uv run maturin develop --release

      - name: Run Rust and Python tests on latest Python
        if: matrix.python-version == '3.14'
        run: make test PYTHON=.venv/bin/python

      - name: Run Python tests on oldest Python
        if: matrix.python-version == '3.9'
        run: make test-python PYTHON=.venv/bin/python

  minimum-dependencies:
    name: Minimum runtime dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ci-cargo-${{ runner.os }}-minimum-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ci-cargo-${{ runner.os }}-minimum-

      - name: Install locked test environment
        run: uv sync --frozen --extra dev --group dev --python 3.9

      - name: Install minimum runtime dependencies
        run: >-
          uv pip install
          --python .venv/bin/python
          --upgrade
          --resolution lowest-direct
          --only-binary numpy
          "gymnasium>=1.1,<2"
          "numpy>=1.26,<3"

      - name: Build editable extension
        run: .venv/bin/python -m maturin develop --release

      - name: Show resolved runtime versions
        run: >-
          .venv/bin/python -c
          "from importlib.metadata import version;
          print('gymnasium=' + version('gymnasium'));
          print('numpy=' + version('numpy'))"

      - name: Run environment-contract and release tests
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_gymnasium_vector_env_contract.py
          tests/test_community_package.py
          tests/test_release_build.py

  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install packaging environment
        run: uv sync --frozen --no-default-groups --group release

      - name: Build and audit distributions
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION.txt)"
          uv run maturin build --release --out dist
          uv run maturin sdist --out dist
          uv run python .codex/skills/build-release/scripts/release_build.py audit-wheels \
            --version "$version" \
            dist/*.whl
          uv run python .codex/skills/build-release/scripts/release_build.py audit-sdist \
            --version "$version" \
            dist/*.tar.gz
          uv run python scripts/check_sdist_internal_crates.py dist/*.tar.gz
          uv run twine check dist/*

      - name: Smoke stable ABI on Python 3.9
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.9
          uv run python .codex/skills/build-release/scripts/release_build.py smoke-wheel \
            dist/*.whl \
            --python "$(uv python find 3.9)"
          uv run python .codex/skills/build-release/scripts/release_build.py smoke-sdist \
            dist/*.tar.gz \
            --python "$(uv python find 3.9)"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-distributions
          path: dist/*
          if-no-files-found: error
