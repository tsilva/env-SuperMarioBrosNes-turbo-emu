[build-system]
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "env-supermariobrosnes-turbo-emu"
version = "0.7.0"
description = "Blazing fast SuperMarioBros-Nes environment for Reinforcement Learning."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Tiago Silva" }]
maintainers = [{ name = "Tiago Silva" }]
keywords = [
  "gymnasium",
  "nes",
  "reinforcement-learning",
  "rust",
  "super-mario-bros",
  "vector-environment",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium>=1.1,<2",
  "numpy>=1.26,<3",
]

[project.scripts]
smb-turbo = "supermariobrosnes_turbo.cli:main"

[project.urls]
Homepage = "https://github.com/tsilva/env-SuperMarioBrosNes-turbo-emu"
Documentation = "https://github.com/tsilva/env-SuperMarioBrosNes-turbo-emu#readme"
Repository = "https://github.com/tsilva/env-SuperMarioBrosNes-turbo-emu.git"
Issues = "https://github.com/tsilva/env-SuperMarioBrosNes-turbo-emu/issues"
Changelog = "https://github.com/tsilva/env-SuperMarioBrosNes-turbo-emu/blob/main/CHANGES.md"

[project.optional-dependencies]
playback = [
]
oracle = [
  "env-stableretro-turbo==1.0.1.post44; python_version == '3.14'",
]
test = [
  "pytest>=8",
]
dev = [
  "huggingface-hub>=1.8.0; python_version >= '3.10'",
  "maturin>=1.9.3,<2",
  "pytest>=8",
  "env-stableretro-turbo==1.0.1.post44; python_version == '3.14'",
]

[tool.maturin]
module-name = "supermariobrosnes_turbo._supermariobrosnes_turbo"
python-source = "python"
features = ["pyo3/extension-module"]
include = [
  "python/supermariobrosnes_turbo/data/**/*.state",
  "python/supermariobrosnes_turbo/data/**/metadata.json",
  "python/supermariobrosnes_turbo/py.typed",
]
exclude = ["python/supermariobrosnes_turbo/data/**/rom.nes"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { env-stableretro-turbo = false }
constraint-dependencies = [
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
  "cryptography>=50.0.0; python_version >= '3.10'",
  "filelock>=3.20.3; python_version >= '3.10'",
  "pytest>=8.4.2,<9; python_version < '3.10'",
  "pytest>=9.0.3; python_version >= '3.10'",
  "requests>=2.33.0; python_version >= '3.10'",
  "urllib3>=2.7.0; python_version >= '3.10'",
]

[tool.pytest.ini_options]
pythonpath = [".", "python"]
addopts = "--basetemp=.pytest-tmp -m 'not retro_oracle'"
markers = [
  "retro_oracle: manual acceptance tests that compare against env-stableretro-turbo and require the local ROM",
]

[dependency-groups]
dev = [
    "cibuildwheel>=2.23.4,<4; python_version >= '3.10'",
    "huggingface-hub>=1.8.0; python_version >= '3.10'",
    "twine>=6.2.0; python_version >= '3.10'",
]
release = [
    "cibuildwheel>=2.23.4,<4; python_version >= '3.10'",
    "maturin>=1.9.3,<2",
    "twine>=6.2.0; python_version >= '3.10'",
]
